name: Sync Sugeridos UTM desde OneDrive a Supabase

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: 'Periodo (ej: 2026-11)'
        required: true
        default: '2026-11'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install openpyxl requests

      - name: Descargar planilla desde OneDrive y sincronizar a Supabase
        env:
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PERIODO: ${{ github.event.inputs.periodo }}
        run: python scripts/sync_sugeridos.py
